name: Import Correct App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: saleh12340/New-Tamim-invoices
  SOURCE_BRANCH: v2-ai-enhanced

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout empty target repository
        uses: actions/checkout@v4

      - name: Import verified source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source
          git clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" /tmp/source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-correct-app.yml' \
            /tmp/source/ ./
          printf 'Imported from %s branch %s at %s\n' "$SOURCE_REPO" "$SOURCE_BRANCH" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > SOURCE_IMPORT_INFO.txt
          rm -f .github/workflows/import-correct-app.yml

      - name: Commit imported application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import correct Tamim invoice app'
          git push origin HEAD:main

      - name: Build imported application
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug assembleRelease --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: friendly-winnertamim-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: friendly-winnertamim-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
