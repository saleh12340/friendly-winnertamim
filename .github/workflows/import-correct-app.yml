name: Import Correct App

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: saleh12340/New-Tamim-invoices
  SOURCE_BRANCH: v2-ai-enhanced

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Import verified source branch
        if: hashFiles('SOURCE_IMPORT_INFO.txt') == ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source
          git clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" /tmp/source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/source/ ./
          printf 'Imported from %s branch %s at %s\n' "$SOURCE_REPO" "$SOURCE_BRANCH" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > SOURCE_IMPORT_INFO.txt

      - name: Commit imported application
        if: hashFiles('SOURCE_IMPORT_INFO.txt') != '' && hashFiles('IMPORT_COMMITTED.txt') == ''
        shell: bash
        run: |
          set -euo pipefail
          touch IMPORT_COMMITTED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import correct Tamim invoice app'
          git push origin HEAD:main
